<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #bubble {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%) scale(0.7);
        padding: 6px 12px;
        border-radius: 14px;
        background: rgba(30, 26, 22, 0.82);
        color: #f4e9da;
        font: 600 15px/1.2 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }
      #bubble.show {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
